services:
  - type: web
    name: rims-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_HOST
        fromDatabase:
          name: rims-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rims-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: rims-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: rims-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rims-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: rims-db
          property: connectionString

databases:
  - name: rims-db
    databaseName: rims_db
    user: rims_user
    plan: free
    region: oregon
